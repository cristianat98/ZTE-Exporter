name: Release

on:
  push:
    branches: [master]

jobs:
  version-and-changelog:
    name: Bump version & update changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # dry_run: computes the next tag/version without creating or pushing
      # a tag yet. The tag must not exist until AFTER the version.go and
      # CHANGELOG.md updates below are committed, otherwise it points at a
      # commit that doesn't contain them (see "Tag release commit" step).
      - name: Compute next semantic version
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Update version.go
        env:
          VERSION: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          sed -i "s/const Version = \".*\"/const Version = \"${VERSION}\"/" cmd/version.go

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.tag_version.outputs.new_tag }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md cmd/version.go
          git commit -m "chore(release): ${{ steps.tag_version.outputs.new_tag }} [skip ci]"
          git push origin HEAD:master

      # Tag the commit we just pushed (not the one before it), so
      # docker-publish/github-release below check out a commit that
      # actually contains the version bump and changelog entry.
      - name: Tag release commit
        run: |
          git tag ${{ steps.tag_version.outputs.new_tag }}
          git push origin ${{ steps.tag_version.outputs.new_tag }}

  docker-publish:
    name: Publish Docker image
    needs: version-and-changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-and-changelog.outputs.new_tag }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            cristianat/zte-exporter:${{ needs.version-and-changelog.outputs.new_tag }}
            cristianat/zte-exporter:latest

  github-release:
    name: Publish GitHub release
    needs: version-and-changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-and-changelog.outputs.new_tag }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # No -ldflags needed here: version.go was already updated and
      # committed into this tagged commit by version-and-changelog.
      - name: Build release binaries
        env:
          VERSION: ${{ needs.version-and-changelog.outputs.new_tag }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${platform%/*}
            arch=${platform#*/}
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            out="dist/zte-exporter-${VERSION}-${os}-${arch}${ext}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -o "$out" ./cmd
          done

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version-and-changelog.outputs.new_tag }}
          generate_release_notes: true
          files: dist/*
