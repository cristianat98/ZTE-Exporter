name: Claude Full Repo Review (Manual)

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional area to focus the review on (leave blank for a general review)"
        required: false
        type: string
      model:
        description: "Claude model to use"
        required: false
        type: choice
        default: claude-opus-5
        options:
          - claude-opus-5
          - claude-sonnet-5
          - claude-haiku-4-5
          - claude-opus-4-8
          - claude-sonnet-4-6

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: ${{ github.ref_name }}
            FOCUS: ${{ inputs.focus }}

            Please review the full repository as checked out on this branch, with a focus on:
            - Code quality, architecture, and Go best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            If FOCUS is non-empty, pay special attention to that area, without ignoring the rest.

            Note: The full repository is already checked out in the current working directory.

            Open a single GitHub issue titled "Claude repository review - <date>" summarizing
            your findings, organized by severity. Use `gh issue create` to post it.
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools "Read,Grep,Glob,Bash(gh issue create:*)"
