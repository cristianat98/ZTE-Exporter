version: "2"

run:
  timeout: 5m

linters:
  default: standard
  settings:
    errcheck:
      # Deferred Close() calls on response bodies and test servers are
      # safe to ignore: there is nothing actionable to do with the error
      # at that point in either case.
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write

formatters:
  enable:
    - gofmt
    - goimports
